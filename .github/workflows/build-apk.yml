name: Build Lumidra APK

# Se déclenche à chaque push sur main, et manuellement depuis l'onglet "Actions" du repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Mettre en cache les dépendances Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Accepter les licences du SDK Android (sécurité supplémentaire)
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Installer les dépendances npm
        run: npm ci

      # ---- Filet de sécurité logique : si un changement casse le jeu, on s'arrête ICI,
      # avant de passer de longues minutes à construire un APK qui ne fonctionnerait plus. ----
      - name: Tests automatisés (logique du jeu)
        id: gametest
        run: npm test > /tmp/test.log 2>&1
        continue-on-error: true

      - name: Afficher le résultat des tests (toujours)
        if: always()
        run: cat /tmp/test.log

      - name: Publier le diagnostic des tests en commentaire si échec
        if: steps.gametest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 /tmp/test.log > /tmp/test_trimmed.log
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/test_trimmed.log || true

      - name: Échouer explicitement si les tests ont échoué
        if: steps.gametest.outcome == 'failure'
        run: exit 1

      - name: Synchroniser le projet Android (copie www/ + régénère les plugins Capacitor/Cordova)
        id: capcopy
        run: npx cap sync android > /tmp/capcopy.log 2>&1
        continue-on-error: true

      - name: Afficher le log de copie (toujours, réussite ou non)
        if: always()
        run: cat /tmp/capcopy.log

      - name: Publier le diagnostic en commentaire si l'étape précédente a échoué
        if: steps.capcopy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 /tmp/capcopy.log > /tmp/capcopy_trimmed.log
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/capcopy_trimmed.log || true

      - name: Échouer explicitement si la copie a échoué
        if: steps.capcopy.outcome == 'failure'
        run: exit 1

      # ---- Signature release : le keystore n'existe jamais en clair dans le dépôt.
      # S'il n'est pas configuré (secrets absents), cette étape est simplement ignorée et
      # Gradle retombe sur la signature debug (voir android/app/build.gradle). ----
      - name: Préparer la signature release (si configurée)
        if: ${{ secrets.LUMIDRA_KEYSTORE_B64 != '' }}
        env:
          LUMIDRA_KEYSTORE_B64: ${{ secrets.LUMIDRA_KEYSTORE_B64 }}
        run: |
          echo "$LUMIDRA_KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/lumidra-release.keystore"
          echo "LUMIDRA_KEYSTORE_PATH=${{ github.workspace }}/lumidra-release.keystore" >> "$GITHUB_ENV"

      - name: Construire l'APK
        id: gradlebuild
        working-directory: android
        env:
          LUMIDRA_KEYSTORE_PASSWORD: ${{ secrets.LUMIDRA_KEYSTORE_PASSWORD }}
          LUMIDRA_KEY_ALIAS: ${{ secrets.LUMIDRA_KEY_ALIAS }}
          LUMIDRA_KEY_PASSWORD: ${{ secrets.LUMIDRA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace > /tmp/gradle.log 2>&1
        continue-on-error: true

      - name: Afficher le log Gradle (toujours)
        if: always()
        run: tail -c 8000 /tmp/gradle.log

      - name: Publier le diagnostic Gradle en commentaire si échec
        if: steps.gradlebuild.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 /tmp/gradle.log > /tmp/gradle_trimmed.log
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/gradle_trimmed.log || true

      - name: Échouer explicitement si la construction a échoué
        if: steps.gradlebuild.outcome == 'failure'
        run: exit 1

      - name: Localiser l'APK produit (signé release, ou signature debug si pas de secrets configurés)
        id: apkpath
        run: echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: Mettre l'APK à disposition en téléchargement (artefact, connexion requise)
        uses: actions/upload-artifact@v4
        with:
          name: lumidra-apk-build-${{ github.run_number }}
          path: ${{ steps.apkpath.outputs.path }}
          retention-days: 90

      # ---- Une Release versionnée par construction : l'historique est conservé (plus de
      # suppression), et "latest" continue de pointer automatiquement vers la plus récente. ----
      - name: Publier l'APK en Release GitHub (lien public, sans connexion requise, pas de zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.apkpath.outputs.path }}" lumidra.apk
          gh release create "build-${{ github.run_number }}" lumidra.apk \
            --title "Lumidra — version 1.0.${{ github.run_number }}" \
            --notes "Construit automatiquement depuis le commit ${{ github.sha }}" \
            --latest
