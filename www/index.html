<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumidra — Fais éclore ta légende</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C9A24B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumidra">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="Lumidra, jeu de collection et de soin de dragons. Sans publicité, jouable hors-ligne, deux modes : Éclosion (10+) et Stratège (14+).">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lumidra-app" class="lumidra-root">
  <div id="onboarding-root"></div>
  <div id="main-shell">
    <div id="topbar-root"></div>
    <div id="screen-root" class="flex-1" style="display:flex;flex-direction:column;min-height:0;"></div>
    <div id="navbar-root"></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
</div>
<script src="js/01-data-content.js"></script>
<script src="js/02-i18n-helpers.js"></script>
<script src="js/03-icons-art.js"></script>
<script src="js/04-game-logic.js"></script>
<script src="js/05-screens.js"></script>
<script src="js/06-modals-share.js"></script>
<script src="js/07-actions-render.js"></script>
<script src="js/08-app.js"></script>
<script>
if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
